[project]
name = "simsar-mcp"
version = "0.1.0"
description = "Give your AI the eyes of a trader - Market data MCP server"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirat Can Bayrak", email = "miratcanbayrak@gmail.com"}]
keywords = ["mcp", "claude", "trading", "crypto", "bitcoin", "technical-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://simsar.trade"
Repository = "https://github.com/miratcan/simsar-mcp"

[project.scripts]
simsar-mcp = "simsar_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
